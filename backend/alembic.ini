# A generic, single database configuration.

[alembic]
# path to migration scripts
script_location = alembic

# template used to generate migration file names; The default is %(rev)s_%(slug)s
# Uncomment both lines below to use the slug-based filenames
# file_template = %%(rev)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present.
# Defaults to the current working directory.
prepend_sys_path = .

# timezone to use when rendering the date within the migration file
# as well as the filename.
# If specified in the form of UTC, or UTC+3, tzinfo will be
# set from zoneinfo.ZoneInfo or dateutil.tz.gettz.
# Required if used with the %(year)s, %(month)s, %(day)s, %(hour)s,
# %(minute)s, %(second)s date formatting tokens.
# timezone = UTC

# max length of characters to apply to the
# "slug" field
# file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# set to 'true' to run the environment during
# the 'offline' mode, via --alembic-offline option
# output_generate_dgl = --sql
output_encoding = utf-8

[post_write_hooks]
# run the formatter/linter on generated scripts
# for example the black formatter:
# hooks = black
# type_hook = black/black/app
# hooks.type = black

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_class]

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

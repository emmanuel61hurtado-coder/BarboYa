line-length = 120
target-version = "py312"

[lint]
# Reglas basicas de correccion (errores de sintaxis, nombres indefinidos, imports sin usar).
select = ["E4", "E7", "E9", "F"]
# SQLAlchemy usa `== True` / `== None` para construir expresiones SQL.
ignore = ["E711", "E712"]

[lint.per-file-ignores]
"__init__.py" = ["F401"]

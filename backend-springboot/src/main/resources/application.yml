spring:
  application:
    name: barboya-api
  datasource:
    url: ${DATABASE_URL:jdbc:h2:file:./barboya_dev;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: ${HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}

server:
  port: ${PORT:8000}

barboya:
  app-name: Barboya API
  environment: ${ENVIRONMENT:development}
  jwt:
    secret: ${JWT_SECRET:CAMBIAR-EN-PRODUCCION}
    algorithm: HS256
    expire-minutes: 1440
    issuer: barboya-auth
    audience: barboya-api
  cors-origins: "*"
  price-daily-cop: 3000
  price-weekly-cop: 15000
  price-monthly-cop: 50000
  default-trip-fee-cop: 300
  stopped-alert-seconds: 180
  face-check-interval-minutes: 240
  offer-ttl-seconds: 120
  s3-bucket: barboya-media
  chain-rpc-url: ${CHAIN_RPC_URL:}
  chain-id: 80002
  payment-token-address: ${PAYMENT_TOKEN_ADDRESS:}
  payment-token-symbol: USDC
  payment-token-decimals: 6
  treasury-address: ${TREASURY_ADDRESS:}
  cop-per-token: 4000
  required-confirmations: 12
  topup-min-cop: 1000
  topup-max-cop: 500000
  indexer-interval-seconds: 15.0
# Perfil de las pruebas automaticas. La base de datos la inyecta cada ejecucion.
spring:
  # Servidor ficticio: las pruebas sustituyen el envio
  mail:
    host: correo.barboya.test

barboya:
  # Las pruebas lanzan el vencimiento a mano; el reloj adelantado afectaria a otras
  orders:
    expiry-job-enabled: false
  security:
    auth-requests-per-minute: 100000
  mail:
    from: no-responder@barboya.test
  files:
    directory: ${java.io.tmpdir}/barboya-test-files

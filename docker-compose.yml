services:
  postgres:
    image: postgres:16-alpine
    container_name: barboya_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-barboya}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-barboyasecret}
      POSTGRES_DB: ${POSTGRES_DB:-barboya_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-barboya} -d ${POSTGRES_DB:-barboya_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: barboya_backend
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-barboya}:${POSTGRES_PASSWORD:-barboyasecret}@postgres:5432/${POSTGRES_DB:-barboya_db}
      - SECRET_KEY=${SECRET_KEY:-supersecretkeychangemeinproduction_barboya_2026}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-["*"]}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@barboya.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-Admin123*}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
        VITE_USE_MOCKS: ${VITE_USE_MOCKS:-false}
    container_name: barboya_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:

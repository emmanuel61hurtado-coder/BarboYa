version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-barboya}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Error: Variable POSTGRES_PASSWORD no definida en Coolify}
      POSTGRES_DB: ${POSTGRES_DB:-barboya_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-barboya} -d $${POSTGRES_DB:-barboya_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-barboya}
      - POSTGRES_DB=${POSTGRES_DB:-barboya_db}
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-barboya}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-barboya_db}}
      - SECRET_KEY=${SECRET_KEY:?Error: Variable SECRET_KEY no definida en Coolify}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-["*"]}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@barboya.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?Error: Variable ADMIN_PASSWORD no definida en Coolify}
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && python -m app.scripts.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  postgres_data:


name: BarboYa CI

on:
  push:
    branches: ["main", "master", "develop"]
  pull_request:
    branches: ["main", "master", "develop"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: ./backend

jobs:
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar Ruff
        run: pip install ruff

      - name: Ruff check
        run: ruff check app/ tests/

  test-sqlite:
    name: Tests (SQLite en memoria)
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
      SECRET_KEY: ci_test_secret_key_with_at_least_32_chars_000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest-cov

      - name: Pytest (modelos, seguridad y API)
        run: pytest -v --cov=app --cov-report=term-missing --cov-report=xml

      - name: Subir reporte de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: backend/coverage.xml
          if-no-files-found: ignore

  test-postgres:
    name: Tests + migraciones (PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: barboya
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: barboya_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U barboya -d barboya_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: test
      SECRET_KEY: ci_test_secret_key_with_at_least_32_chars_000
      DATABASE_URL: postgresql+asyncpg://barboya:ci_password@localhost:5432/barboya_test
      TEST_DATABASE_URL: postgresql+asyncpg://barboya:ci_password@localhost:5432/barboya_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Alembic upgrade head (valida las migraciones)
        run: alembic upgrade head

      - name: Pytest contra PostgreSQL
        run: pytest -v

  docker:
    name: Docker build y compose
    runs-on: ubuntu-latest
    needs: [lint, test-sqlite]
    steps:
      - uses: actions/checkout@v4

      - name: Build de la imagen del backend
        working-directory: .
        run: docker build -t barboya-backend:ci ./backend

      - name: Validar docker-compose.backend.yml
        working-directory: .
        env:
          POSTGRES_PASSWORD: ci_password
          SECRET_KEY: ci_test_secret_key_with_at_least_32_chars_000
          ADMIN_PASSWORD: ci_admin_password_123
        run: docker compose -f docker-compose.backend.yml config --quiet

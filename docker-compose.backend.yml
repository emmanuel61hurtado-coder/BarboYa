# Despliegue SOLO del backend (FastAPI + PostgreSQL), pensado para Coolify.
# En Coolify: Build Pack = Docker Compose, "Docker Compose Location" = /docker-compose.backend.yml
# El dominio se asigna automaticamente al servicio `backend` (puerto 8010) via SERVICE_FQDN_BACKEND_8010.
# Variables obligatorias (Environment Variables): POSTGRES_PASSWORD, SECRET_KEY (>=32 chars), ADMIN_PASSWORD.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-barboya}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-barboya_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-barboya} -d ${POSTGRES_DB:-barboya_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - SERVICE_FQDN_BACKEND_8010
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-barboya}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-barboya_db}
      - SECRET_KEY=${SECRET_KEY:?define SECRET_KEY (openssl rand -hex 32)}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-["*"]}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@barboya.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?define ADMIN_PASSWORD}
    expose:
      - "8010"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8010/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

volumes:
  postgres_data:
